# Pluggable Workspace Tools, in the same format as the environment editor's
# "Pluggable Workspace Tools" field in the Domino UI.
#
# Each top-level key is a tool id. Keys per tool:
#   title                    display name (required)
#   iconUrl                  icon path (optional)
#   start                    list of start commands/scripts, run as ubuntu (required)
#   supportedFileExtensions  file types the tool opens (optional)
#   httpProxy:
#     port                   the port the tool listens on (required; 8888 in the DSE)
#     internalPath           path the tool is served at (optional; a default is used if omitted)
#     rewrite                URL rewriting needed for routing (default false)
#     requireSubdomain       needs a subdomain-enabled deployment (default false)
jupyterlab:
  title: "JupyterLab"
  iconUrl: "/assets/images/workspace-logos/jupyterlab.svg"
  start: [ "/opt/domino/workspaces/jupyterlab/start" ]
  httpProxy:
    internalPath: "/{{ownerUsername}}/{{projectName}}/{{sessionPathComponent}}/{{runId}}/{{#if pathToOpen}}tree/{{pathToOpen}}{{/if}}"
    port: 8888
    rewrite: false
    requireSubdomain: false
vscode:
  title: "vscode"
  iconUrl: "/assets/images/workspace-logos/vscode.svg"
  start: [ "/opt/domino/workspaces/vscode/start" ]
  httpProxy:
    port: 8888
    requireSubdomain: false
